twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:}
  auth:
    token: ${TWILIO_AUTH_TOKEN:}
  sender:
    number: ${TWILIO_SENDER_NUMBER:}

orange:
  client:
    id: ${ORANGE_CLIENT_ID:}
    secret: ${ORANGE_CLIENT_SECRET:}
  token:
    url: ${ORANGE_TOKEN_URL:}
  sms:
    base:
      url: ${ORANGE_SMS_BASE_URL:}
  sender:
    address: ${ORANGE_SENDER_ADDRESS:}
    name: ${ORANGE_SENDER_NAME:}
  country:
    code: ${ORANGE_COUNTRY_CODE:237}

avlytext:
  api:
    key: ${AVLYTEXT_API_KEY:}
  base:
    url: ${AVLYTEXT_BASE_URL:}
  sender:
    id: ${AVLYTEXT_SENDER_ID:}

fineract:
  api:
    url: ${FINERACT_API_URL:https://fineract:8443/fineract-provider/api/v1}
    user: ${FINERACT_API_USER:mifos}
    password: ${FINERACT_API_PASSWORD:password}
    tenant: ${FINERACT_API_TENANT:default}
  auth:
    type: ${FINERACT_AUTH_TYPE:basic}
keycloak:
  url: ${KEYCLOAK_URL:http://localhost:9000/realms/fineract/protocol/openid-connect/token}
  grant-type: ${KEYCLOAK_GRANT_TYPE:password}
  client-id: ${KEYCLOAK_CLIENT_ID:setup-app-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:**********}

sms:
  provider:
    primary: ${SMS_PROVIDER_PRIMARY:twilio}
    fallback: ${SMS_PROVIDER_FALLBACK:}
  custom-http:
    url: ${SMS_CUSTOM_HTTP_URL:}
    api-key: ${SMS_CUSTOM_HTTP_API_KEY:}
    sender: ${SMS_CUSTOM_HTTP_SENDER:Webank}
  sns:
    region: ${SMS_SNS_REGION:}
    sender-id: ${SMS_SNS_SENDER_ID:Webank}
    max-price: ${SMS_SNS_MAX_PRICE:}
  whatsapp:
    base-url: ${SMS_WHATSAPP_BASE_URL:}
    device-id: ${SMS_WHATSAPP_DEVICE_ID:}
  mock:
    enabled: ${SMS_MOCK_ENABLED:false}

logging:
  level:
    com.example.smsgateway.provider.OrangeSmsProvider: DEBUG

# API key required on the X-SMS-Gateway-Api-Key header for BFF-facing endpoints
# (/sms/send, /otp/send, /otp/verify, /api/v1/otp/*). A missing key rejects
# every BFF-facing request with 401 (fail-closed) so misconfig is loud.
# Set SMS_GATEWAY_API_KEY to the shared secret (must match the BFF's
# SMS_GATEWAY_API_KEY). The docker-compose-adorsys.yml stack passes this
# through from the host environment, defaulting to `dev-sms-gateway-key`
# so the default stack works out of the box; override it in production.
#
# Dev/test only: set SMS_GATEWAY_AUTH_DISABLED=true to bypass API-key auth
# entirely. Never enable in production — doing so reopens the open SMS-relay
# risk this filter closes.
#
# NOTE: SMS_GATEWAY_API_KEY and SMS_GATEWAY_AUTH_DISABLED are read directly by
# ApiKeyAuthFilter via @Value annotations. They are NOT declared as YAML keys
# here to avoid the circular-placeholder failure described above.

# Android SMS Retriever app hash — the 11-character token appended to every
# OTP SMS so the client app can read it without SMS permissions.
#
# Derived from the package name AND the signing certificate, so debug and
# release builds have DIFFERENT hashes. Generate with
# mobile/scripts/generate_android_sms_hash.sh in webank-mobile, per keystore.
#
# Intentionally has no default: a wrong hash fails silently (autofill just
# never happens), so an unset value must fail loudly at startup instead.
android:
  otp:
    hash: ${ANDROID_OTP_HASH}

